name: Deploy Full Stack App to Dev

on:
  push:
    branches:
      - develop
  workflow_dispatch: # Allows manual triggering from the GitHub Actions tab

env:
  REGISTRY: ghcr.io
  # This automatically converts your repository name to lowercase to comply with Docker image naming rules
  IMAGE_NAME: ${{ github.repository }} 

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # 1. Check out the code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Node.js environment
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-value: '20' # Adjust this to your specific Node version if needed
          cache: 'npm'

      # 3. Install clean production dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Run Quality Gates (Lint & Test)
      - name: Run Linting
        run: npm run lint --if-present

      - name: Run Tests
        run: npm run test --if-present

      # 5. Build the production assets
      - name: Build Application
        run: npm run build --if-present

      # 6. Log in to GitHub Container Registry (GHCR)
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 7. Extract metadata (tags, labels) for Docker
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=ref,event=branch

      # 8. Build and Push Docker Image
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (for docker-compose file access)
        uses: actions/checkout@v4

      # 9. Connect via SSH, update environment variables, pull and run containers
      - name: Deploy to Dev Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ${{ secrets.DEV_USER }}
          key: ${{ secrets.DEV_SSH_KEY }}
          envs: REGISTRY,IMAGE_NAME,GITHUB_SHA
          script: |
            # Create app directory if it doesn't exist
            mkdir -p ~/app
            cd ~/app

            # Write the dev environment file from repository secrets
            echo "${{ secrets.DEV_ENV_FILE }}" > .env
            
            # Export image tag for docker-compose configuration dynamically
            echo "IMAGE_TAG=sha-${GITHUB_SHA}" >> .env

            # Log into GHCR inside the remote EC2 instance
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

            # Pull latest built image down to the server
            docker compose pull

            # Spin up containers in detached mode, removing orphaned containers
            docker compose up -d --remove-orphans

      # 10. Verify /health and fail pipeline if deployment is unhealthy
      - name: Health Check Verification
        run: |
          echo "Waiting for services to boot up..."
          sleep 15
          
          # Use WEB_ORIGIN if set, fallback directly to DEV_HOST IP address
          TARGET_URL="${{ secrets.DEV_HOST }}"
          
          echo "Pinging health check endpoint at http://$TARGET_URL/health"
          
          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://$TARGET_URL/health || echo "000")
          
          if [ "$STATUS_CODE" -ne 200 ]; then
            echo "❌ Deployment Health Check Failed with Status Code: $STATUS_CODE"
            exit 1
          else
            echo "✅ Deployment is Healthy! Status Code: 200"
          fi
