services:
  mongodb:
    image: mongo:8
    container_name: commerceflow-mongodb
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    # Initiates the single-node replica set on first run, then reports healthy once PRIMARY.
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "try { rs.status().myState === 1 ? quit(0) : quit(1) } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongodb:27017'}]}); quit(1) }"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: commerceflow-api
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      MONGODB_URI: mongodb://mongodb:27017/commerceflow?replicaSet=rs0&directConnection=true
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET (min 32 chars) in .env}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:8080}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    ports:
      - "3000:3000"
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    container_name: commerceflow-web
    environment:
      API_UPSTREAM: http://api:3000
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  mongo_data: